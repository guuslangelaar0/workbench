<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench Mesh — Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23b8860b'/%3E%3C/svg%3E">
<script>
// Stamp system preference before styles apply; the in-app toggle overrides it.
if (!document.documentElement.getAttribute('data-theme')) {
  document.documentElement.setAttribute('data-theme',
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
</script>
<link rel="stylesheet" href="/assets/command-center/style.css">
<link rel="stylesheet" href="/assets/command-center/style-surfaces.css">
</head>
<body data-density="comfortable">

<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <div class="banner" id="banner" hidden></div>
  <main class="surface" id="surface"></main>
  <footer class="statusline" id="statusline"></footer>
</div>

<div id="overlay-root"></div>

<script>
window.TWEAK_DEFAULTS = { "hostState": "healthy", "level": "solo", "density": "comfortable" };
// First-visit token prompt: the dashboard needs the bearer token printed by
// `/workbench:mesh start` (or an invite-derived one). Normally it arrives as
// ?token= and is cached; without it, ask once instead of failing silently.
(function () {
  var params = new URLSearchParams(window.location.search);
  if (params.get('token') || window.localStorage.getItem('meshCommandToken')) return;
  document.addEventListener('DOMContentLoaded', function () {
    var veil = document.createElement('div');
    veil.className = 'modal-veil';
    var modal = document.createElement('div');
    modal.className = 'modal';
    var h = document.createElement('h3'); h.textContent = 'Bearer token needed';
    var p = document.createElement('p');
    p.textContent = 'Paste the token printed by /workbench:mesh start (or open the dashboard from the CLI, which appends it automatically).';
    var input = document.createElement('input'); input.type = 'text'; input.placeholder = 'token'; input.style.width = '100%';
    var actions = document.createElement('div'); actions.className = 'modal-actions';
    var btn = document.createElement('button'); btn.className = 'btn primary'; btn.textContent = 'Connect';
    btn.addEventListener('click', function () {
      var t = input.value.trim();
      if (!t) return;
      window.localStorage.setItem('meshCommandToken', t);
      window.location.reload();
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.click(); });
    actions.appendChild(btn);
    modal.appendChild(h); modal.appendChild(p); modal.appendChild(input); modal.appendChild(actions);
    veil.appendChild(modal);
    document.getElementById('overlay-root').appendChild(veil);
  });
})();
</script>

<script src="/assets/command-center/icons.js"></script>
<script src="/assets/command-center/data.js"></script>
<script src="/assets/command-center/ui.js"></script>
<script src="/assets/command-center/live.js"></script>
<script src="/assets/command-center/bench.js"></script>
<script src="/assets/command-center/board.js"></script>
<script src="/assets/command-center/host.js"></script>
<script src="/assets/command-center/ops.js"></script>
<script src="/assets/command-center/docs.js"></script>
<script src="/assets/command-center/app.js"></script>
</body>
</html>
